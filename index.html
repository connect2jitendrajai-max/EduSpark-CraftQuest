<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSpark Craft Quest</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, sans-serif;
  background:#111;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(#65c9ff 0%,#a9e8ff 48%,#7fc85a 48%,#4c9b3c 100%);
}

/* SUN */
#sun{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ffe66d;
  top:70px;
  right:12%;
  box-shadow:0 0 45px #fff0a0;
}

/* CLOUDS */
.cloud{
  position:absolute;
  width:170px;
  height:45px;
  background:white;
  border-radius:40px;
  opacity:.85;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud:before{
  width:70px;
  height:70px;
  left:25px;
  top:-30px;
}

.cloud:after{
  width:85px;
  height:85px;
  right:20px;
  top:-40px;
}

.c1{top:100px;left:8%;animation:cloudMove 30s linear infinite;}
.c2{top:180px;left:55%;transform:scale(.7);animation:cloudMove 42s linear infinite;}

@keyframes cloudMove{
  from{margin-left:-100px}
  to{margin-left:120vw}
}

/* WORLD */
#world{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:55%;
}

/* GROUND */
.ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:45%;
  background:
    repeating-linear-gradient(
      90deg,
      #65b84b 0px,
      #65b84b 45px,
      #59a943 46px,
      #59a943 90px
    );
  border-top:8px solid #3d7c31;
}

/* BLOCKS */
.block{
  position:absolute;
  width:65px;
  height:65px;
  border:3px solid rgba(0,0,0,.18);
  box-shadow:inset 0 8px rgba(255,255,255,.08);
}

.grass{
  background:#65b84b;
}

.dirt{
  background:#9b633d;
}

.stone{
  background:#777;
}

.water{
  background:#3da9e8;
  opacity:.9;
}

/* TREE */
.tree{
  position:absolute;
  bottom:42%;
  width:80px;
  height:190px;
}

.trunk{
  position:absolute;
  bottom:0;
  left:31px;
  width:22px;
  height:100px;
  background:#75482d;
  border:3px solid #51301e;
}

.leaf{
  position:absolute;
  width:80px;
  height:80px;
  background:#278c45;
  border:5px solid #176333;
  border-radius:22px;
}

.l1{top:0;left:0}
.l2{top:40px;left:-25px}
.l3{top:40px;left:25px}
.l4{top:75px;left:0}

/* PLAYER */
#player{
  position:absolute;
  width:48px;
  height:78px;
  left:50%;
  bottom:45%;
  transform:translateX(-50%);
  z-index:20;
  transition:left .05s linear;
}

.head{
  position:absolute;
  top:0;
  left:8px;
  width:32px;
  height:32px;
  background:#f2b47e;
  border:3px solid #703e29;
}

.hair{
  position:absolute;
  top:-4px;
  left:6px;
  width:36px;
  height:13px;
  background:#3b241a;
  z-index:2;
}

.eye{
  position:absolute;
  width:5px;
  height:5px;
  background:#111;
  top:15px;
}

.e1{left:16px}
.e2{left:27px}

.body{
  position:absolute;
  top:32px;
  left:7px;
  width:34px;
  height:30px;
  background:#2878d8;
  border:3px solid #17477e;
}

.leg{
  position:absolute;
  top:60px;
  width:13px;
  height:20px;
  background:#333;
  border:3px solid #181818;
}

.leg1{left:8px}
.leg2{left:27px}

/* HUD */
#hud{
  position:absolute;
  top:15px;
  left:15px;
  z-index:100;
  color:white;
}

.panel{
  background:rgba(0,0,0,.55);
  border:2px solid rgba(255,255,255,.25);
  border-radius:14px;
  padding:12px 16px;
  margin-bottom:8px;
  backdrop-filter:blur(5px);
}

#title{
  font-size:20px;
  font-weight:bold;
}

#stats{
  font-size:15px;
  line-height:25px;
}

/* CROSSHAIR */
#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:22px;
  height:22px;
  transform:translate(-50%,-50%);
  z-index:30;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 3px #000;
}

#crosshair:before{
  width:22px;
  height:2px;
  top:10px;
}

#crosshair:after{
  width:2px;
  height:22px;
  left:10px;
}

/* CONTROLS */
#controls{
  position:absolute;
  right:18px;
  bottom:18px;
  z-index:100;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
  max-width:330px;
}

.control{
  width:58px;
  height:58px;
  border:none;
  border-radius:15px;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:25px;
  cursor:pointer;
  border:2px solid rgba(255,255,255,.25);
  touch-action:none;
}

.control:active{
  transform:scale(.92);
  background:#222;
}

#missionButton{
  width:auto;
  padding:0 18px;
  font-size:15px;
  font-weight:bold;
}

/* START SCREEN */
#startScreen{
  position:absolute;
  inset:0;
  z-index:200;
  background:
    radial-gradient(circle at center,rgba(80,160,255,.25),rgba(0,0,0,.9));
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
}

.startBox{
  width:min(90%,500px);
  padding:35px;
  border-radius:25px;
  background:rgba(15,25,40,.92);
  border:2px solid rgba(255,255,255,.2);
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.startBox h1{
  font-size:42px;
  margin-bottom:10px;
}

.startBox p{
  color:#cbd5e1;
  line-height:1.6;
  margin-bottom:25px;
}

#startButton{
  border:0;
  border-radius:14px;
  padding:16px 35px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  background:#ffd447;
  color:#352800;
}

/* MISSION */
#mission{
  position:absolute;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.65);
}

.missionBox{
  width:min(90%,480px);
  background:white;
  color:#172033;
  border-radius:22px;
  padding:28px;
  text-align:center;
}

.missionBox h2{
  margin-bottom:12px;
}

.question{
  font-size:30px;
  font-weight:bold;
  margin:20px 0;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.answer{
  padding:14px;
  border:0;
  border-radius:12px;
  background:#e9eef7;
  font-size:18px;
  cursor:pointer;
}

.answer:hover{
  background:#d8e3f5;
}

#message{
  margin-top:15px;
  min-height:24px;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:600px){
  #title{
    font-size:16px;
  }

  #stats{
    font-size:12px;
  }

  .control{
    width:52px;
    height:52px;
  }

  .startBox h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <div id="hud">
    <div class="panel">
      <div id="title">⚡ EduSpark Craft Quest</div>
      <div id="stats">
        ❤️ <span id="health">100</span>
        &nbsp; 🪙 <span id="coins">0</span>
        &nbsp; ⭐ XP <span id="xp">0</span>
      </div>
    </div>
  </div>

  <div id="world">

    <div class="ground"></div>

    <!-- BLOCKS -->
    <div class="block grass" style="left:8%;bottom:45%"></div>
    <div class="block grass" style="left:calc(8% + 65px);bottom:45%"></div>
    <div class="block dirt" style="left:8%;bottom:calc(45% - 65px)"></div>

    <div class="block stone" style="left:75%;bottom:45%"></div>
    <div class="block stone" style="left:calc(75% + 65px);bottom:45%"></div>

    <!-- WATER -->
    <div class="block water" style="left:40%;bottom:43%;width:130px"></div>

    <!-- TREES -->
    <div class="tree" style="left:18%">
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
      <div class="leaf l3"></div>
      <div class="leaf l4"></div>
      <div class="trunk"></div>
    </div>

    <div class="tree" style="left:82%;transform:scale(.8)">
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
      <div class="leaf l3"></div>
      <div class="leaf l4"></div>
      <div class="trunk"></div>
    </div>

  </div>

  <!-- PLAYER -->
  <div id="player">
    <div class="head">
      <div class="hair"></div>
      <div class="eye e1"></div>
      <div class="eye e2"></div>
    </div>
    <div class="body"></div>
    <div class="leg leg1"></div>
    <div class="leg leg2"></div>
  </div>

  <div id="crosshair"></div>

  <!-- CONTROLS -->
  <div id="controls">
    <button class="control" id="left">◀</button>
    <button class="control" id="jump">⬆</button>
    <button class="control" id="right">▶</button>
    <button class="control" id="missionButton">🧠 MATH MISSION</button>
  </div>

  <!-- START -->
  <div id="startScreen">
    <div class="startBox">
      <h1>🌍 EduSpark Craft Quest</h1>
      <p>
        Explore the block world.<br>
        Collect coins, earn XP and solve maths challenges.
      </p>
      <button id="startButton">START ADVENTURE 🚀</button>
    </div>
  </div>

  <!-- MISSION -->
  <div id="mission">
    <div class="missionBox">
      <h2>🧠 Maths Mission</h2>
      <p>Solve the challenge to earn XP!</p>

      <div class="question" id="question">
        8 × 7 = ?
      </div>

      <div class="answers" id="answers"></div>

      <div id="message"></div>
    </div>
  </div>

</div>

<script>

const player = document.getElementById("player");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");

const coinsText = document.getElementById("coins");
const xpText = document.getElementById("xp");
const healthText = document.getElementById("health");

const mission = document.getElementById("mission");
const missionButton = document.getElementById("missionButton");

let gameStarted = false;

let playerX = window.innerWidth / 2;
let coins = 0;
let xp = 0;
let health = 100;

let movingLeft = false;
let movingRight = false;

let velocityY = 0;
let jumping = false;

const gravity = 0.8;
const jumpPower = 14;

function updatePlayer(){

  if(!gameStarted) return;

  if(movingLeft){
    playerX -= 5;
  }

  if(movingRight){
    playerX += 5;
  }

  const maxX = window.innerWidth - 60;

  if(playerX < 10) playerX = 10;
  if(playerX > maxX) playerX = maxX;

  if(jumping){
    velocityY -= gravity;

    let currentBottom =
      parseFloat(getComputedStyle(player).bottom);

    currentBottom += velocityY;

    if(currentBottom <= window.innerHeight * .45){
      currentBottom = window.innerHeight * .45;
      jumping = false;
      velocityY = 0;
    }

    player.style.bottom = currentBottom + "px";
  }

  player.style.left = playerX + "px";

  requestAnimationFrame(updatePlayer);
}

/* START */

startButton.addEventListener("click",function(){

  gameStarted = true;

  startScreen.style.display="none";

  player.style.left =
    (window.innerWidth/2) + "px";

  player.style.bottom =
    (window.innerHeight*.45) + "px";

  updatePlayer();

  collectCoin();

});

/* MOVEMENT */

function startMove(direction){

  if(direction==="left"){
    movingLeft=true;
  }

  if(direction==="right"){
    movingRight=true;
  }
}

function stopMove(direction){

  if(direction==="left"){
    movingLeft=false;
  }

  if(direction==="right"){
    movingRight=false;
  }
}

const leftButton =
document.getElementById("left");

const rightButton =
document.getElementById("right");

leftButton.addEventListener("pointerdown",()=>{
  startMove("left");
});

leftButton.addEventListener("pointerup",()=>{
  stopMove("left");
});

leftButton.addEventListener("pointerleave",()=>{
  stopMove("left");
});

rightButton.addEventListener("pointerdown",()=>{
  startMove("right");
});

rightButton.addEventListener("pointerup",()=>{
  stopMove("right");
});

rightButton.addEventListener("pointerleave",()=>{
  stopMove("right");
});

/* KEYBOARD */

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    movingLeft=true;
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    movingRight=true;
  }

  if(
    (e.key==="ArrowUp" ||
     e.key==="w" ||
     e.key===" ")
     && !jumping
  ){
    jumping=true;
    velocityY=jumpPower;
  }

});

document.addEventListener("keyup",function(e){

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    movingLeft=false;
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    movingRight=false;
  }

});

/* JUMP BUTTON */

document.getElementById("jump")
.addEventListener("pointerdown",function(){

  if(!jumping){

    jumping=true;
    velocityY=jumpPower;

  }

});

/* COIN */

function collectCoin(){

  if(!gameStarted) return;

  setTimeout(function(){

    coins++;

    coinsText.textContent=coins;

    collectCoin();

  },5000);

}

/* MATH MISSION */

const questions = [

  {
    q:"8 × 7 = ?",
    a:["54","56","64","48"],
    correct:"56"
  },

  {
    q:"Perimeter of a square with side 6 cm?",
    a:["12 cm","18 cm","24 cm","36 cm"],
    correct:"24 cm"
  },

  {
    q:"25% of 80 = ?",
    a:["10","15","20","25"],
    correct:"20"
  },

  {
    q:"12 + 18 × 2 = ?",
    a:["60","48","42","36"],
    correct:"48"
  },

  {
    q:"Area of rectangle 8 × 5 = ?",
    a:["13","26","40","80"],
    correct:"40"
  }

];

let currentQuestion = 0;

function openMission(){

  if(!gameStarted) return;

  mission.style.display="flex";

  showQuestion();

}

missionButton.addEventListener("click",openMission);

function showQuestion(){

  const data =
    questions[currentQuestion];

  document.getElementById("question")
    .textContent=data.q;

  const answers =
    document.getElementById("answers");

  answers.innerHTML="";

  document.getElementById("message")
    .textContent="";

  data.a.forEach(function(answer){

    const button =
      document.createElement("button");

    button.className="answer";

    button.textContent=answer;

    button.addEventListener("click",function(){

      checkAnswer(answer);

    });

    answers.appendChild(button);

  });

}

function checkAnswer(answer){

  const data =
    questions[currentQuestion];

  const message =
    document.getElementById("message");

  if(answer===data.correct){

    xp += 20;

    coins += 5;

    xpText.textContent=xp;
    coinsText.textContent=coins;

    message.textContent =
      "🎉 Correct! +20 XP +5 Coins";

    setTimeout(function(){

      currentQuestion++;

      if(currentQuestion>=questions.length){

        currentQuestion=0;

        message.textContent =
          "🏆 Mission Complete!";

        setTimeout(()=>{
          mission.style.display="none";
        },1000);

      }else{

        showQuestion();

      }

    },900);

  }else{

    health -= 10;

    if(health<0) health=0;

    healthText.textContent=health;

    message.textContent =
      "❌ Not correct. Try again!";

  }

}

/* RESIZE */

window.addEventListener("resize",function(){

  if(playerX > window.innerWidth-60){
    playerX=window.innerWidth-60;
  }

});

</script>

</body>
</html>
