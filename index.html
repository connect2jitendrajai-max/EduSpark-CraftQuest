<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSpark Craft Quest</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#72cfff;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #55c7ff 0%,
      #b9efff 55%,
      #75cf4b 55%,
      #75cf4b 100%
    );
}

/* =========================
   SKY
========================= */

.sun{
  position:absolute;
  width:90px;
  height:90px;
  right:8%;
  top:7%;
  border-radius:50%;
  background:#ffe03b;
  box-shadow:0 0 45px #fff2a0;
}

.cloud{
  position:absolute;
  width:150px;
  height:45px;
  background:white;
  border-radius:50px;
  opacity:.9;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud:before{
  width:70px;
  height:70px;
  left:25px;
  top:-35px;
}

.cloud:after{
  width:60px;
  height:60px;
  right:25px;
  top:-28px;
}

.c1{
  left:8%;
  top:12%;
}

.c2{
  left:45%;
  top:20%;
  transform:scale(.7);
}

.c3{
  left:72%;
  top:9%;
  transform:scale(.55);
}

/* =========================
   WORLD
========================= */

#world{
  position:absolute;
  left:0;
  bottom:0;
  width:6000px;
  height:48vh;
  will-change:left;
}

.ground{
  position:absolute;
  left:0;
  bottom:0;
  width:6000px;
  height:125px;
  background:
    repeating-linear-gradient(
      90deg,
      #69c83f 0 40px,
      #5fbd38 40px 80px
    );
  border-top:8px solid #3e9c31;
}

.dirt{
  position:absolute;
  left:0;
  bottom:0;
  width:6000px;
  height:72px;
  background:
    radial-gradient(
      circle at 20px 20px,
      #a56437 0 5px,
      transparent 6px
    ),
    radial-gradient(
      circle at 70px 50px,
      #70401f 0 4px,
      transparent 5px
    ),
    #8a522c;
}

/* =========================
   TREES
========================= */

.tree{
  position:absolute;
  bottom:125px;
  width:150px;
  height:235px;
}

.trunk{
  position:absolute;
  bottom:0;
  left:58px;
  width:35px;
  height:125px;
  background:#85512c;
  border:4px solid #613a20;
}

.leaf{
  position:absolute;
  width:72px;
  height:72px;
  background:#319d3d;
  border:5px solid #24792e;
  border-radius:13px;
}

.l1{
  left:8px;
  top:35px;
}

.l2{
  left:55px;
  top:5px;
}

.l3{
  left:82px;
  top:55px;
}

.l4{
  left:35px;
  top:82px;
}

.t1{left:450px}
.t2{left:1250px}
.t3{left:2200px}
.t4{left:3300px}
.t5{left:4700px}
.t6{left:5400px}

/* =========================
   ROCKS
========================= */

.rock{
  position:absolute;
  bottom:125px;
  width:70px;
  height:55px;
  background:#777;
  border:5px solid #555;
  border-radius:14px 18px 8px 8px;
}

.r1{left:750px}
.r2{left:1700px}
.r3{left:2850px}
.r4{left:4050px}
.r5{left:5100px}

/* =========================
   WATER
========================= */

.water{
  position:absolute;
  bottom:125px;
  height:75px;
  background:linear-gradient(#42c9f2,#238ed1);
  border-top:6px solid #86eaff;
}

.w1{
  left:930px;
  width:270px;
}

.w2{
  left:2450px;
  width:360px;
}

.w3{
  left:3750px;
  width:300px;
}

.w4{
  left:5050px;
  width:300px;
}

/* =========================
   COINS
========================= */

.coin{
  position:absolute;
  width:31px;
  height:31px;
  border-radius:50%;
  background:#ffd72f;
  border:4px solid #e4a700;
  box-shadow:0 0 15px #ffe66e;
  animation:coinFloat .8s infinite alternate;
  z-index:8;
}

@keyframes coinFloat{
  from{
    transform:translateY(0);
  }
  to{
    transform:translateY(-12px);
  }
}

/* =========================
   PLAYER
========================= */

#player{
  position:fixed;
  width:48px;
  height:80px;
  left:45%;
  bottom:125px;
  z-index:50;
  pointer-events:none;
}

.head{
  position:absolute;
  left:3px;
  top:0;
  width:42px;
  height:42px;
  background:#ffc18b;
  border:4px solid #71452e;
  border-radius:9px;
}

.eye{
  position:absolute;
  top:13px;
  width:7px;
  height:7px;
  background:#222;
  border-radius:50%;
}

.e1{left:9px}
.e2{right:9px}

.body{
  position:absolute;
  left:5px;
  top:39px;
  width:38px;
  height:37px;
  background:#1976d2;
  border:4px solid #15539a;
  border-radius:7px;
}

.leg{
  position:absolute;
  bottom:-24px;
  width:15px;
  height:25px;
  background:#263238;
  border-radius:4px;
}

.leg1{left:6px}
.leg2{right:6px}

.walk .leg1{
  animation:walk1 .18s infinite alternate;
}

.walk .leg2{
  animation:walk2 .18s infinite alternate;
}

@keyframes walk1{
  to{
    transform:rotate(22deg);
  }
}

@keyframes walk2{
  to{
    transform:rotate(-22deg);
  }
}

/* =========================
   ENEMIES
========================= */

.enemy{
  position:absolute;
  width:54px;
  height:70px;
  bottom:125px;
  background:#d93c45;
  border:5px solid #8c2028;
  border-radius:12px;
  z-index:20;
}

.enemy:before{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  left:9px;
  top:14px;
  background:white;
  box-shadow:23px 0 white;
}

.enemy:after{
  content:"";
  position:absolute;
  width:27px;
  height:7px;
  left:9px;
  top:36px;
  background:#431015;
  border-radius:5px;
}

/* =========================
   BLOCKS
========================= */

.block{
  position:absolute;
  width:48px;
  height:48px;
  border:3px solid rgba(0,0,0,.2);
  box-shadow:inset 4px 4px rgba(255,255,255,.15);
  cursor:pointer;
  z-index:10;
}

.grassBlock{
  background:
    linear-gradient(
      #5cc43d 0 23%,
      #8c542c 23% 100%
    );
}

.stoneBlock{
  background:#777;
}

.woodBlock{
  background:#9b642e;
}

.goldBlock{
  background:#ffd32f;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:100;
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.stat{
  padding:10px 14px;
  color:white;
  background:rgba(20,30,40,.9);
  border-radius:14px;
  font-weight:bold;
  box-shadow:0 4px 10px #0005;
}

#missionBtn{
  position:fixed;
  right:15px;
  top:15px;
  z-index:120;
  border:0;
  padding:13px 18px;
  border-radius:15px;
  background:#ffb300;
  color:#222;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 10px #0005;
}

/* =========================
   INVENTORY
========================= */

#inventory{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:120;
  display:flex;
  gap:7px;
  padding:10px;
  background:rgba(20,25,30,.94);
  border-radius:18px;
}

.slot{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border:3px solid #888;
  border-radius:10px;
  background:#30343a;
  font-size:28px;
  cursor:pointer;
}

.slot.selected{
  border-color:#ffe13b;
  transform:translateY(-5px);
}

.count{
  position:absolute;
  right:4px;
  bottom:2px;
  color:white;
  font-size:13px;
  font-weight:bold;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:fixed;
  left:15px;
  bottom:95px;
  z-index:120;
  display:flex;
  gap:8px;
}

.control{
  width:58px;
  height:58px;
  border:0;
  border-radius:16px;
  background:rgba(20,30,40,.86);
  color:white;
  font-size:25px;
  box-shadow:0 4px 8px #0005;
}

/* =========================
   MESSAGE
========================= */

#message{
  position:fixed;
  left:50%;
  top:90px;
  transform:translateX(-50%);
  z-index:200;
  padding:12px 22px;
  border-radius:15px;
  background:#222;
  color:white;
  font-weight:bold;
  display:none;
}

/* =========================
   MATH
========================= */

#mathBox{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  align-items:center;
  justify-content:center;
  background:#0008;
  padding:20px;
}

.mathCard{
  width:min(520px,95vw);
  background:white;
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 20px 50px #0008;
}

.mathCard h2{
  margin-top:0;
  color:#1769aa;
}

#question{
  margin:20px 0;
  font-size:25px;
  font-weight:bold;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.answer{
  padding:15px;
  border:0;
  border-radius:14px;
  background:#e5f1ff;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#closeMath{
  margin-top:15px;
  border:0;
  padding:10px 20px;
  border-radius:12px;
}

/* =========================
   START SCREEN
========================= */

#startScreen{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#1769aa,#7b1fa2);
}

#startScreen h1{
  margin:0 0 10px;
  font-size:clamp(38px,7vw,78px);
  text-shadow:5px 5px #0006;
}

#startScreen p{
  max-width:650px;
  padding:0 20px;
  font-size:20px;
  line-height:1.5;
}

#startBtn{
  margin-top:25px;
  padding:18px 35px;
  border:0;
  border-radius:18px;
  background:#ffd42a;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 8px 0 #b38b00;
}

@media(max-width:600px){

  .stat{
    padding:7px 10px;
    font-size:13px;
  }

  #missionBtn{
    padding:10px 12px;
    font-size:12px;
  }

  .slot{
    width:48px;
    height:48px;
    font-size:23px;
  }

  #inventory{
    gap:4px;
    padding:7px;
  }

  #controls{
    bottom:75px;
  }
}
</style>
</head>

<body>

<script>

/* ==================================================
   GAME VARIABLES
================================================== */

const player=document.getElementById("player");
const world=document.getElementById("world");

let worldX=0;

let playerWorldX=250;

let playerY=0;

let velocityY=0;

let leftPressed=false;
let rightPressed=false;

let health=100;
let coins=0;
let xp=0;
let level=1;

let selectedBlock="grass";

let inventory={
  grass:0,
  wood:0,
  stone:0,
  gold:0
};

const PLAYER_SPEED=5;
const GRAVITY=.8;
const JUMP_POWER=15;

let gameStarted=false;


/* ==================================================
   HUD
================================================== */

function updateHUD(){

  document.getElementById("health").textContent=health;

  document.getElementById("coins").textContent=coins;

  document.getElementById("xp").textContent=xp;

  level=Math.floor(xp/50)+1;

  document.getElementById("level").textContent=level;

  document.getElementById("grassCount").textContent=inventory.grass;

  document.getElementById("woodCount").textContent=inventory.wood;

  document.getElementById("stoneCount").textContent=inventory.stone;

  document.getElementById("goldCount").textContent=inventory.gold;
}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(text){

  const box=document.getElementById("message");

  box.textContent=text;

  box.style.display="block";

  clearTimeout(window.msgTimer);

  window.msgTimer=setTimeout(()=>{

    box.style.display="none";

  },1800);
}


/* ==================================================
   START GAME
================================================== */

document.getElementById("startBtn").onclick=()=>{

  gameStarted=true;

  document.getElementById("startScreen").style.display="none";

  showMessage("🚀 Adventure started!");

};


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){

    leftPressed=true;

  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){

    rightPressed=true;

  }

  if(
    e.key==="ArrowUp" ||
    e.key===" " ||
    e.key.toLowerCase()==="w"
  ){

    jump();

  }

});


document.addEventListener("keyup",function(e){

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){

    leftPressed=false;

  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){

    rightPressed=false;

  }

});


/* ==================================================
   MOBILE
================================================== */

function holdButton(button,down,up){

  button.addEventListener(
    "touchstart",
    function(e){

      e.preventDefault();

      down();

    },
    {passive:false}
  );

  button.addEventListener(
    "touchend",
    function(e){

      e.preventDefault();

      up();

    },
    {passive:false}
  );

  button.addEventListener("mousedown",down);

  button.addEventListener("mouseup",up);

  button.addEventListener("mouseleave",up);

}


holdButton(
  document.getElementById("left"),
  ()=>leftPressed=true,
  ()=>leftPressed=false
);


holdButton(
  document.getElementById("right"),
  ()=>rightPressed=true,
  ()=>rightPressed=false
);


document.getElementById("jump").onclick=jump;


/* ==================================================
   JUMP
================================================== */

function jump(){

  if(playerY===0){

    velocityY=JUMP_POWER;

  }

}


/* ==================================================
   MAIN GAME LOOP
================================================== */

function gameLoop(){

  if(gameStarted){

    /* MOVE PLAYER */

    if(leftPressed){

      playerWorldX-=PLAYER_SPEED;

    }

    if(rightPressed){

      playerWorldX+=PLAYER_SPEED;

    }


    /* WORLD LIMIT */

    if(playerWorldX<60){

      playerWorldX=60;

    }

    if(playerWorldX>5900){

      playerWorldX=5900;

    }


    /* JUMP PHYSICS */

    velocityY-=GRAVITY;

    playerY+=velocityY;

    if(playerY<0){

      playerY=0;

      velocityY=0;

    }


    /* ==================================================
       CAMERA FIX
    ================================================== */

    const screenWidth=window.innerWidth;

    const worldWidth=6000;

    /*
      Player stays around 45% of screen.
      World moves instead.
    */

    let desiredCamera=
      playerWorldX-(screenWidth*.45);


    /*
      Camera cannot move before beginning
      or after end of world.
    */

    const maxCamera=
      Math.max(0,worldWidth-screenWidth);


    desiredCamera=
      Math.max(
        0,
        Math.min(
          desiredCamera,
          maxCamera
        )
      );


    /*
      Smooth camera
    */

    worldX +=
      (desiredCamera-worldX)*0.12;


    world.style.left=
      (-worldX)+"px";


    /* ==================================================
       PLAYER ALWAYS VISIBLE
    ================================================== */

    player.style.left=
      (playerWorldX-worldX)+"px";

    player.style.bottom=
      (125+playerY)+"px";


    /* WALK ANIMATION */

    if(leftPressed || rightPressed){

      player.classList.add("walk");

    }else{

      player.classList.remove("walk");

    }


    checkCoins();

    checkEnemies();

  }


  requestAnimationFrame(gameLoop);

}


/* ==================================================
   COIN COLLECTION
================================================== */

function checkCoins(){

  const coinsElements=
    document.querySelectorAll(".coin");


  coinsElements.forEach(coin=>{

    if(coin.dataset.collected==="yes")
      return;


    const coinWorldX=
      parseFloat(
        coin.style.left
      );


    const coinBottom=
      parseFloat(
        coin.style.bottom
      );


    const horizontalDistance=
      Math.abs(
        playerWorldX-
        (coinWorldX+15)
      );


    const verticalDistance=
      Math.abs(
        (125+playerY)-
        coinBottom
      );


    if(
      horizontalDistance<45 &&
      verticalDistance<65
    ){

      coin.dataset.collected="yes";

      coin.style.display="none";

      coins++;

      xp+=5;

      updateHUD();

      showMessage(
        "🪙 Coin collected! +5 XP"
      );

    }

  });

}


/* ==================================================
   ENEMY COLLISION
================================================== */

function checkEnemies(){

  const enemies=
    document.querySelectorAll(".enemy");


  enemies.forEach(enemy=>{

    if(enemy.dataset.hit==="yes")
      return;


    const enemyX=
      parseFloat(
        enemy.style.left
      );


    const distance=
      Math.abs(
        playerWorldX-
        (enemyX+27)
      );


    if(
      distance<55 &&
      playerY<55
    ){

      enemy.dataset.hit="yes";

      health-=10;

      updateHUD();

      showMessage(
        "👾 Enemy attack! -10 ❤️"
      );


      setTimeout(()=>{

        enemy.dataset.hit="no";

      },1200);


      if(health<=0){

        health=100;

        playerWorldX=
          Math.max(
            100,
            playerWorldX-250
          );

        updateHUD();

        showMessage(
          "💥 Respawned!"
        );

      }

    }

  });

}


/* ==================================================
   INVENTORY SELECTION
================================================== */

document.querySelectorAll(".slot")
.forEach(slot=>{

  slot.onclick=()=>{

    document.querySelectorAll(".slot")
    .forEach(s=>
      s.classList.remove("selected")
    );


    slot.classList.add("selected");


    selectedBlock=
      slot.dataset.type;


    showMessage(
      "Selected: "+selectedBlock
    );

  };

});


/* ==================================================
   CREATE MINING BLOCK
================================================== */

function createBlock(
  type,
  leftPosition,
  bottomPosition
){

  const block=
    document.createElement("div");


  block.className="block";


  if(type==="grass")
    block.classList.add("grassBlock");


  if(type==="stone")
    block.classList.add("stoneBlock");


  if(type==="wood")
    block.classList.add("woodBlock");


  if(type==="gold")
    block.classList.add("goldBlock");


  block.style.left=
    leftPosition+"px";


  block.style.bottom=
    bottomPosition+"px";


  block.dataset.type=
    type;


  block.onclick=()=>{

    inventory[type]++;

    coins++;

    xp+=3;

    block.remove();

    updateHUD();

    showMessage(
      "⛏️ "+type+" collected!"
    );

  };


  world.appendChild(block);

}


/* ==================================================
   RESOURCE BLOCKS
================================================== */

const blockTypes=[
  "grass",
  "stone",
  "wood",
  "gold"
];


for(let i=0;i<42;i++){

  const type=
    blockTypes[
      Math.floor(
        Math.random()*
        blockTypes.length
      )
    ];


  const xpos=
    300+(i*130);


  const ypos=
    175+
    Math.random()*100;


  createBlock(
    type,
    xpos,
    ypos
  );

}


/* ==================================================
   BUILDING
   DOUBLE CLICK WORLD
================================================== */

world.addEventListener(
  "dblclick",
  function(e){

    if(!gameStarted)
      return;


    if(
      !inventory[selectedBlock]
    ){

      showMessage(
        "❌ You don't have this block!"
      );

      return;

    }


    const rect=
      world.getBoundingClientRect();


    let blockX=
      e.clientX-
      rect.left+
      worldX-
      24;


    let blockY=
      window.innerHeight-
      e.clientY-
      125-
      24;


    blockX=
      Math.round(blockX/48)*48;


    blockY=
      Math.round(blockY/48)*48;


    if(blockY<0)
      blockY=0;


    createBlock(
      selectedBlock,
      blockX,
      blockY+125
    );


    inventory[selectedBlock]--;

    xp+=3;

    updateHUD();

    showMessage(
      "🧱 Block placed!"
    );

  }
);


/* ==================================================
   MATH QUESTIONS
================================================== */

const questions=[

  {
    q:"What is 7 × 8?",
    a:["54","56","64","48"],
    correct:1
  },

  {
    q:"A square has side 9 cm. What is its perimeter?",
    a:["18 cm","27 cm","36 cm","81 cm"],
    correct:2
  },

  {
    q:"What is 25% of 200?",
    a:["25","40","50","75"],
    correct:2
  },

  {
    q:"What is 12 + 6 × 2?",
    a:["36","24","30","20"],
    correct:1
  },

  {
    q:"A rectangle is 12 cm long and 5 cm wide. What is its area?",
    a:["17 cm²","34 cm²","60 cm²","120 cm²"],
    correct:2
  },

  {
    q:"What is 144 ÷ 12?",
    a:["10","11","12","14"],
    correct:2
  },

  {
    q:"What is 15²?",
    a:["30","150","225","125"],
    correct:2
  },

  {
    q:"If 3 blocks cost 15 coins, one block costs?",
    a:["3","5","8","10"],
    correct:1
  },

  {
    q:"What is 20% of 150?",
    a:["20","25","30","35"],
    correct:2
  },

  {
    q:"What is 9 × 9?",
    a:["72","81","90","99"],
    correct:1
  }

];


/* ==================================================
   OPEN MATH
================================================== */

function openMath(){

  const index=
    Math.floor(
      Math.random()*
      questions.length
    );


  const q=
    questions[index];


  document.getElementById(
    "question"
  ).textContent=q.q;


  const answers=
    document.getElementById(
      "answers"
    );


  answers.innerHTML="";


  q.a.forEach(
    (answer,i)=>{

      const button=
        document.createElement(
          "button"
        );


      button.className=
        "answer";


      button.textContent=
        answer;


      button.onclick=()=>{

        if(i===q.correct){

          xp+=20;

          coins+=5;

          updateHUD();

          showMessage(
            "🎉 Correct! +20 XP +5 🪙"
          );

        }else{

          health-=10;

          updateHUD();

          showMessage(
            "❌ Wrong! -10 ❤️"
          );

          if(health<=0){

            health=100;

            updateHUD();

          }

        }


        document.getElementById(
          "mathBox"
        ).style.display="none";

      };


      answers.appendChild(
        button
      );

    }
  );


  document.getElementById(
    "mathBox"
  ).style.display="flex";

}


document.getElementById(
  "missionBtn"
).onclick=openMath;


document.getElementById(
  "closeMath"
).onclick=()=>{

  document.getElementById(
    "mathBox"
  ).style.display="none";

};


/* ==================================================
   INITIALIZE
================================================== */

updateHUD();

gameLoop();

</script>
