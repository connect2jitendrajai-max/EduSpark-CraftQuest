
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduSpark Dino Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#70dcff;overflow:hidden;color:white}
#game{height:100vh;position:relative;overflow:hidden;background:linear-gradient(#60d7ff 0%,#d1f8ff 48%,#78df72 49%,#237b45 100%)}
#sun{position:absolute;right:9%;top:10%;width:80px;height:80px;border-radius:50%;background:#fff5a3;box-shadow:0 0 45px #fff5a3}
#mountains{position:absolute;bottom:25%;width:200%;height:40%;background:linear-gradient(135deg,transparent 25%,#69b5a1 25% 42%,transparent 42% 55%,#40937f 55% 75%,transparent 75%);animation:mountain 18s linear infinite}
@keyframes mountain{to{transform:translateX(-50%)}}
#trees{position:absolute;bottom:20%;width:200%;height:28%;background:repeating-linear-gradient(90deg,transparent 0 30px,#21844b 31px 43px,transparent 44px 78px);animation:trees 7s linear infinite}
@keyframes trees{to{transform:translateX(-25%)}}
#ground{position:absolute;bottom:0;width:100%;height:22%;background:linear-gradient(#55d64f 0 12%,#a66a3b 12% 20%,#6c4027 20%);border-top:6px solid #b4f65d}
#ground:after{content:"";position:absolute;top:28%;width:200%;height:8px;background:repeating-linear-gradient(90deg,#ffdf83 0 30px,transparent 30px 80px);animation:road .5s linear infinite}
@keyframes road{to{transform:translateX(-80px)}}
#title{position:absolute;top:12%;width:100%;text-align:center;font-size:clamp(28px,5vw,54px);font-weight:1000;text-shadow:0 5px #237445}
#subtitle{position:absolute;top:22%;width:100%;text-align:center;color:#174d45;font-weight:bold;letter-spacing:2px}
#hud{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap}
.stat{background:#10294be8;border:2px solid white;border-radius:12px;padding:8px 12px;font-weight:bold}
#dino{position:absolute;left:13%;bottom:19%;width:100px;height:95px;z-index:3}
.body{position:absolute;left:10px;bottom:12px;width:72px;height:52px;border-radius:45%;background:#24b979;border:4px solid #12694c}
.head{position:absolute;left:49px;top:4px;width:49px;height:44px;border-radius:45%;background:#42d88c;border:4px solid #12694c}
.snout{position:absolute;right:-12px;top:21px;width:25px;height:14px;border-radius:12px;background:#42d88c}
.eye{position:absolute;right:9px;top:8px;width:8px;height:9px;background:white;border-radius:50%;box-shadow:2px 1px #172b35}
.tail{position:absolute;left:-18px;bottom:28px;width:35px;height:18px;background:#24b979;clip-path:polygon(100% 0,100% 100%,0 50%)}
.spikes{position:absolute;left:27px;top:0;width:45px;height:20px;background:repeating-linear-gradient(90deg,transparent 0 8px,#ffcf45 8px 17px,transparent 17px 22px);clip-path:polygon(0 100%,12% 0,28% 100%,45% 0,61% 100%,78% 0,100% 100%)}
.leg{position:absolute;bottom:0;width:21px;height:29px;background:#159764;border:3px solid #12694c;border-radius:7px;animation:run .2s infinite alternate}
.leg.a{left:28px}.leg.b{left:58px;animation-delay:.1s}
@keyframes run{to{transform:rotate(22deg)}}
#dino.jump{animation:jump .7s ease-out}
@keyframes jump{0%,100%{bottom:19%}50%{bottom:52%}}
#dino.duck{transform:scaleY(.62);transform-origin:bottom}
#items{position:absolute;inset:0;z-index:2;pointer-events:none}
.item{position:absolute;font-size:42px;filter:drop-shadow(0 5px 3px #0005)}
#overlay{position:absolute;inset:0;z-index:10;background:#10204bbd;display:flex;align-items:center;justify-content:center;padding:15px}
.panel{width:min(620px,95vw);background:linear-gradient(140deg,#18466b,#562b83);border:3px solid #c0f8ff;border-radius:25px;padding:25px;text-align:center;box-shadow:0 0 40px #183d5c}
.panel h1{font-size:clamp(27px,5vw,45px);margin:0 0 10px}
.panel p{line-height:1.55}
button{cursor:pointer;border:0;border-radius:13px;padding:12px 17px;font-size:16px;font-weight:bold;background:linear-gradient(90deg,#fff071,#ffad45);color:#38264c;margin:4px}
#question{display:none;position:absolute;z-index:8;top:32%;left:50%;transform:translateX(-50%);width:min(500px,92vw);padding:18px;border:3px solid #ffe66d;border-radius:20px;background:#152752f5;text-align:center}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#answers button{background:#31538b;color:white;border:1px solid #c0efff}
#qmsg{min-height:22px;color:#ffe66d;margin-top:8px;font-weight:bold}
#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:6}
#controls button{background:#15355bdd;color:white;border:2px solid white;width:57px;height:53px;padding:0;font-size:22px}
#toast{position:absolute;top:28%;width:100%;text-align:center;font-size:25px;font-weight:bold;color:white;text-shadow:0 3px #277343;z-index:7;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<div id="sun"></div><div id="mountains"></div><div id="trees"></div><div id="ground"></div>
<div id="title">🦖 DINO ADVENTURE</div>
<div id="subtitle">RUN • JUMP • COLLECT • EXPLORE</div>
<div id="hud">
<div class="stat">⭐ <span id="score">0</span></div>
<div class="stat">💎 <span id="gems">0</span></div>
<div class="stat">❤️ <span id="lives">3</span></div>
<div class="stat">🌋 Level <span id="level">1</span></div>
<button id="pause">Ⅱ</button>
</div>
<div id="dino">
<div class="spikes"></div><div class="tail"></div><div class="body"></div>
<div class="head"><div class="eye"></div><div class="snout"></div></div>
<div class="leg a"></div><div class="leg b"></div>
</div>
<div id="items"></div><div id="toast"></div>
<div id="question">
<div id="qtext" style="font-size:22px;font-weight:bold;margin-bottom:12px"></div>
<div id="answers"></div><div id="qmsg"></div>
</div>
<div id="controls">
<div><button id="jumpBtn">⬆ JUMP</button><button id="duckBtn">⬇ DUCK</button></div>
<button id="boostBtn">⚡ BOOST</button>
</div>
<div id="overlay"><div class="panel">
<h1>🌴 DINO ADVENTURE!</h1>
<p>Help your dinosaur explore a lost jungle! Jump over logs, dodge lava, collect gems and solve brain challenges.</p>
<p><b>Controls:</b> SPACE / ↑ = Jump · ↓ = Duck · SHIFT = Boost · P = Pause</p>
<button id="start">▶ START ADVENTURE</button>
<p id="best">🏆 Best score: 0</p>
</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const dino=$('dino'),items=$('items'),overlay=$('overlay'),question=$('question');
let live=false,paused=false,score=0,gems=0,lives=3,level=1,speed=5,last=0,spawnAt=0,qAt=0,boostTo=0,invuln=0,objects=[],raf=0;
let best=Number(localStorage.getItem('dinoBest')||0);$('best').textContent='🏆 Best score: '+best;
function hud(){$('score').textContent=score;$('gems').textContent=gems;$('lives').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));$('level').textContent=level}
function toast(t){$('toast').textContent=t;setTimeout(()=>{$('toast').textContent=''},900)}
function jump(){if(!live||paused||dino.classList.contains('jump'))return;dino.classList.add('jump');setTimeout(()=>dino.classList.remove('jump'),700)}
function duck(){if(!live||paused)return;dino.classList.add('duck');setTimeout(()=>dino.classList.remove('duck'),600)}
function boost(){if(!live||paused)return;boostTo=performance.now()+1500;score+=10;toast('⚡ SUPER SPEED!');hud()}
function spawn(){
let r=Math.random(),type=r<.48?'gem':r<.75?'log':r<.9?'lava':'branch';
let el=document.createElement('div');el.className='item';
el.textContent=type==='gem'?['💎','🪙','⭐'][Math.floor(Math.random()*3)]:type==='log'?'🪵':type==='lava'?'🌋':'🌿';
el.style.left='105%';el.style.top=type==='branch'?'57%':type==='gem'?'62%':'auto';
if(type==='log'||type==='lava')el.style.bottom='17%';
items.appendChild(el);objects.push({el,type,x:105,hit:false});
}
function overlap(a,b){let x=a.getBoundingClientRect(),y=b.getBoundingClientRect();return x.left<y.right-8&&x.right>y.left+8&&x.top<y.bottom-8&&x.bottom>y.top+8}
function remove(o){o.el.remove();objects=objects.filter(v=>v!==o)}
function ask(){
if(!live||paused||question.style.display==='block')return;
let bank=[
['What is 7 × 8?',['54','56','64','48'],1],
['Which number is prime?',['21','25','27','31'],3],
['Next: 3, 6, 12, 24, ...',['30','36','42','48'],3],
['How many sides has a pentagon?',['4','5','6','8'],1],
['What is 25% of 80?',['10','15','20','25'],2],
['Perimeter of a square with side 6 cm?',['12 cm','18 cm','24 cm','36 cm'],2],
['What is 144 ÷ 12?',['10','11','12','14'],2],
['If x + 9 = 17, x = ?',['6','7','8','9'],2]
];
let q=bank[Math.floor(Math.random()*bank.length)];$('qtext').textContent='🧠 '+q[0];$('answers').innerHTML='';$('qmsg').textContent='';
q[1].forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(i===q[2]){score+=100;gems+=3;$('qmsg').textContent='🎉 Correct! +100 points +3 gems';}else $('qmsg').textContent='Keep going, adventurer!';hud();setTimeout(()=>{question.style.display='none';qAt=performance.now()},850)};$('answers').appendChild(b)});
question.style.display='block';
}
function start(){
objects.forEach(remove);objects=[];score=0;gems=0;lives=3;level=1;speed=5;live=true;paused=false;
last=performance.now();spawnAt=last;qAt=last;boostTo=0;invuln=0;
question.style.display='none';overlay.style.display='none';$('pause').textContent='Ⅱ';hud();raf=requestAnimationFrame(loop);
}
function gameOver(){
live=false;cancelAnimationFrame(raf);best=Math.max(best,score);localStorage.setItem('dinoBest',best);
$('best').textContent='🏆 Best score: '+best;
overlay.style.display='flex';overlay.querySelector('h1').textContent='🏁 ADVENTURE OVER!';
overlay.querySelector('p').innerHTML='Score: <b>'+score+'</b> · Gems: <b>'+gems+'</b><br>Try again and beat your best score!';
$('start').textContent='↻ PLAY AGAIN';
}
function loop(now){
if(!live)return;raf=requestAnimationFrame(loop);if(paused){last=now;return}
let dt=Math.min(40,now-last);last=now;let mult=now<boostTo?1.7:1;
score+=Math.floor(dt*.012*mult);level=1+Math.floor(score/450);speed=Math.min(13,5+level*.55);
if(now-spawnAt>Math.max(470,1120-level*48)){spawn();spawnAt=now}
if(now-qAt>17000&&question.style.display!=='block')ask();
for(let o of [...objects]){
o.x-=speed*dt*.025*mult;o.el.style.left=o.x+'%';
if(o.x< -10){remove(o);continue}
if(!o.hit&&overlap(dino,o.el)){
if(o.type==='gem'){o.hit=true;gems++;score+=35;toast('+35 ✨');remove(o)}
else if(now>invuln){
if(o.type==='branch'&&dino.classList.contains('duck')){remove(o);score+=10}
else if((o.type==='log'||o.type==='lava')&&dino.classList.contains('jump')){remove(o);score+=10}
else{lives--;invuln=now+1200;dino.style.opacity='.35';setTimeout(()=>dino.style.opacity='1',250);toast('💥 Ouch!');remove(o);if(lives<=0){hud();gameOver();return}}
}hud();
}
}
hud();
}
$('start').onclick=()=>{overlay.querySelector('h1').textContent='🌴 DINO ADVENTURE!';$('start').textContent='▶ START ADVENTURE';start()};
$('pause').onclick=()=>{if(!live)return;paused=!paused;if(paused){overlay.style.display='flex';overlay.querySelector('h1').textContent='⏸ PAUSED';overlay.querySelector('p').textContent='Your dinosaur is resting. Press Resume to continue.';$('start').textContent='▶ RESUME'}else{overlay.style.display='none';last=performance.now();$('pause').textContent='Ⅱ'}};
$('jumpBtn').onclick=jump;$('duckBtn').onclick=duck;$('boostBtn').onclick=boost;
document.addEventListener('keydown',e=>{
if(['ArrowUp','ArrowDown',' ','Shift'].includes(e.key))e.preventDefault();
if(e.key===' '||e.key==='ArrowUp'||e.key.toLowerCase()==='w')jump();
if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')duck();
if(e.key==='Shift')boost();
if(e.key.toLowerCase()==='p')$('pause').click();
});
hud();
</script>
</body>
</html>
