
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduSpark Ultimate Chase</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101b35;font-family:Arial;color:white}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.box{background:#10182cdd;padding:10px;border:1px solid #ffffff55;border-radius:12px;font-weight:bold;font-size:14px}
button{border:0;border-radius:12px;padding:12px 18px;background:#20d889;color:#07271a;font-weight:bold;font-size:16px;cursor:pointer}
#menu{position:fixed;inset:0;background:#07132be9;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.card{max-width:580px;background:linear-gradient(145deg,#263f75,#171d43);padding:30px;border-radius:25px;border:2px solid #ffffff33;box-shadow:0 15px 60px #0008}
h1{font-size:clamp(30px,6vw,55px);margin:0 0 12px;color:#ffe66d}
p{line-height:1.6}
#question{position:fixed;display:none;inset:0;background:#07132bf2;align-items:center;justify-content:center;text-align:center;padding:15px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.answers button{background:#38bdf8;color:#07132b}
#mobile{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:20px}
#mobile button{width:65px;height:60px;background:#10182cdd;color:white;border:1px solid #ffffff77;font-size:24px}
.hidden{display:none!important}
#pause{pointer-events:auto}
@media(min-width:800px){#mobile{opacity:.5}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
 <div class="box">🏆 <span id="score">0</span><br>🪙 <span id="coins">0</span></div>
 <div class="box">❤️ <span id="lives">3</span><br>LEVEL <span id="level">1</span></div>
 <button id="pause">Ⅱ</button>
</div>

<div id="menu">
 <div class="card">
  <h1>⚡ EDUSPARK</h1>
  <h2>THE GREAT THIEF CHASE</h2>
  <p>🏃 Run through the city!<br>🪙 Collect coins and dodge obstacles.<br>🧠 Solve maths questions to earn bonus points.<br>🚔 Catch the thief before he escapes!</p>
  <p>Keyboard: ← → to move · SPACE to jump · P to pause</p>
  <button id="start">🚀 START MISSION</button>
 </div>
</div>

<div id="question">
 <div class="card">
  <h1>🧠 MATHS BREAK!</h1>
  <h2 id="qtext">What is 7 × 8?</h2>
  <div class="answers" id="answers"></div>
  <p id="feedback"></p>
 </div>
</div>

<div id="mobile" class="hidden">
 <button id="left">⬅</button><button id="jump">⬆</button><button id="right">➡</button>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,roadY,raf=0,last=0;
function resize(){
 W=canvas.width=innerWidth;H=canvas.height=innerHeight;
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 roadY=H*.75;
}
addEventListener('resize',resize);resize();

let running=false,paused=false,asking=false;
let score=0,coins=0,lives=3,level=1,world=0,spawn=0,coinSpawn=0;
let speed=5,questionCount=0;
const player={lane:1,x:0,y:0,vy:0,jumping:false,anim:0,inv:0};
const thief={x:0,anim:0};
let obstacles=[],gold=[],particles=[],buildings=[];
const laneX=i=>W*(.29+i*.21);

function reset(){
 score=0;coins=0;lives=3;level=1;world=0;spawn=0;coinSpawn=0;speed=5;
 obstacles=[];gold=[];particles=[];questionCount=0;
 player.lane=1;player.x=laneX(1);player.y=roadY;player.vy=0;
 player.jumping=false;player.inv=0;player.anim=0;
 thief.x=W*.78;thief.anim=0;
}

function start(){
 cancelAnimationFrame(raf);reset();
 $('menu').classList.add('hidden');$('question').style.display='none';
 $('hud').classList.remove('hidden');$('mobile').classList.remove('hidden');
 running=true;paused=false;asking=false;last=performance.now();
 $('pause').textContent='Ⅱ';updateHud();raf=requestAnimationFrame(loop);
}
function end(win){
 running=false;cancelAnimationFrame(raf);
 $('hud').classList.add('hidden');$('mobile').classList.add('hidden');
 $('menu').classList.remove('hidden');
 $('menu').innerHTML=`<div class="card"><h1>${win?'🏆 MISSION COMPLETE!':'💥 GAME OVER'}</h1>
 <h2>${win?'The thief is caught!':'The thief escaped!'}</h2>
 <p>Final score: <b>${Math.floor(score)}</b><br>Coins: <b>${coins}</b><br>Level: <b>${level}</b></p>
 <button id="start">🔄 PLAY AGAIN</button></div>`;
 $('start').onclick=start;
}
function updateHud(){
 $('score').textContent=Math.floor(score);$('coins').textContent=coins;
 $('lives').textContent='❤️'.repeat(Math.max(0,lives));
 $('level').textContent=level;
}
function left(){if(running&&!paused&&!asking){player.lane=Math.max(0,player.lane-1);player.x=laneX(player.lane)}}
function right(){if(running&&!paused&&!asking){player.lane=Math.min(2,player.lane+1);player.x=laneX(player.lane)}}
function jump(){if(running&&!paused&&!asking&&!player.jumping){player.vy=-15;player.jumping=true}}
addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();
 if(e.code==='ArrowLeft'||e.code==='KeyA')left();
 if(e.code==='ArrowRight'||e.code==='KeyD')right();
 if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();
 if(e.code==='KeyP')togglePause();
});
$('left').onclick=left;$('right').onclick=right;$('jump').onclick=jump;
$('start').onclick=start;
$('pause').onclick=togglePause;
function togglePause(){
 if(!running||asking)return;
 paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';
 if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}
}
function spawnObstacle(){
 let lane=Math.floor(Math.random()*3);
 obstacles.push({x:W+50,lane,type:Math.random()<.5?'barrier':'crate',hit:false});
}
function spawnCoin(){
 let lane=Math.floor(Math.random()*3);
 gold.push({x:W+30,lane,y:roadY-45-Math.random()*35,spin:0});
}
function burst(x,y,color){
 for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:35,color});
}
function drawSky(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#36a6f5');g.addColorStop(1,'#ffe0a1');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(W*.82,H*.15,35,0,7);ctx.fill();
 for(let i=0;i<9;i++){
  let x=((i*170-world*.35)%(W+200)+W+200)%(W+200)-80;
  let h=90+(i*47)%160,y=roadY-h;
  ctx.fillStyle=['#526b91','#415675','#60758e'][i%3];
  ctx.fillRect(x,y,90,h);
  for(let wy=y+15;wy<roadY-12;wy+=25)for(let wx=x+12;wx<x+80;wx+=25){
   ctx.fillStyle=(Math.floor(wx+wy)%3)?'#ffe08a':'#a9e6ff';
   ctx.fillRect(wx,wy,9,12);
  }
 }
}
function drawRoad(){
 ctx.fillStyle='#48a83d';ctx.fillRect(0,roadY,W,H-roadY);
 ctx.fillStyle='#333b49';ctx.beginPath();
 ctx.moveTo(W*.17,roadY);ctx.lineTo(W*.83,roadY);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();
 ctx.moveTo(W*.17,roadY);ctx.lineTo(0,H);ctx.moveTo(W*.83,roadY);ctx.lineTo(W,H);ctx.stroke();
 ctx.strokeStyle='#ffe45c';ctx.lineWidth=3;ctx.setLineDash([25,25]);
 for(let i=1;i<=2;i++){
  let x=W*(.17+i*.22);ctx.beginPath();ctx.moveTo(x,roadY);ctx.lineTo(x,H);ctx.stroke();
 }
 ctx.setLineDash([]);
}
function drawPerson(x,y,isThief,t){
 ctx.save();ctx.translate(x,y);
 let run=Math.sin(t)*9;
 ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,3,25,7,0,0,7);ctx.fill();
 ctx.strokeStyle=isThief?'#151515':'#15294a';ctx.lineWidth=9;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(-13+run,-32);
 ctx.moveTo(8,-8);ctx.lineTo(13-run,-32);ctx.stroke();
 ctx.strokeStyle='#f0bb90';ctx.lineWidth=7;ctx.beginPath();
 ctx.moveTo(-15,-51);ctx.lineTo(-26-run*.3,-34);
 ctx.moveTo(15,-51);ctx.lineTo(26+run*.3,-34);ctx.stroke();
 ctx.fillStyle=isThief?'#24252c':'#1976ff';
 ctx.beginPath();ctx.roundRect(-18,-66,36,48,8);ctx.fill();
 ctx.fillStyle='#f2c29b';ctx.beginPath();ctx.arc(0,-81,16,0,7);ctx.fill();
 ctx.fillStyle='#302017';ctx.beginPath();ctx.arc(0,-87,16,Math.PI,2*Math.PI);ctx.fill();
 if(isThief){
  ctx.fillStyle='#111';ctx.fillRect(-16,-85,32,9);
  ctx.fillStyle='white';ctx.fillRect(-8,-82,4,3);ctx.fillRect(5,-82,4,3);
  ctx.fillStyle='#f5c542';ctx.beginPath();ctx.arc(27,-42,11,0,7);ctx.fill();
 }else{
  ctx.fillStyle='white';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('E',0,-37);
 }
 ctx.restore();
}
function draw(){
 drawSky();drawRoad();
 gold.forEach(c=>{
  ctx.save();ctx.translate(c.x,c.y);ctx.scale(Math.max(.15,Math.abs(Math.cos(c.spin))),1);
  ctx.fillStyle='#ffd32a';ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();
  ctx.strokeStyle='#fff5ae';ctx.lineWidth=3;ctx.stroke();ctx.restore();
 });
 obstacles.forEach(o=>{
  let x=o.x,y=roadY;
  ctx.fillStyle=o.type==='crate'?'#a56a32':'#ed4545';
  ctx.fillRect(x-22,y-42,44,42);
  ctx.strokeStyle='#ffe66d';ctx.lineWidth=3;ctx.strokeRect(x-22,y-42,44,42);
  if(o.type==='crate'){ctx.beginPath();ctx.moveTo(x-20,y-40);ctx.lineTo(x+20,y-3);ctx.moveTo(x+20,y-40);ctx.lineTo(x-20,y-3);ctx.stroke()}
 });
 if(!player.inv||Math.floor(world*3)%2===0)drawPerson(player.x,player.y, false,player.anim);
 drawPerson(thief.x,roadY,true,thief.anim);
 particles.forEach(p=>{ctx.globalAlpha=p.life/35;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5);ctx.globalAlpha=1});
}
function askMath(){
 asking=true;paused=true;
 let a=2+Math.floor(Math.random()*12),b=2+Math.floor(Math.random()*10),ans=a*b;
 $('qtext').textContent=`What is ${a} × ${b}?`;
 $('feedback').textContent='';
 let opts=new Set([ans]);
 while(opts.size<4)opts.add(Math.max(1,ans+Math.floor(Math.random()*21)-10));
 let arr=[...opts].sort(()=>Math.random()-.5);
 $('answers').innerHTML='';
 arr.forEach(n=>{
  let btn=document.createElement('button');btn.textContent=n;
  btn.onclick=()=>{
   if(n===ans){score+=250;$('feedback').textContent='✅ Correct! +250 points';}
   else{$('feedback').textContent='❌ Correct answer: '+ans;}
   setTimeout(()=>{
    $('question').style.display='none';asking=false;paused=false;
    last=performance.now();raf=requestAnimationFrame(loop);
   },800);
  };
  $('answers').appendChild(btn);
 });
 $('question').style.display='flex';
}
function loop(now){
 if(!running||paused)return;
 let dt=Math.min(.04,(now-last)/1000);last=now;
 world+=dt*60;player.anim+=dt*13;thief.anim+=dt*15;
 player.vy+=.8;player.y+=player.vy;
 if(player.y>=roadY){player.y=roadY;player.vy=0;player.jumping=false}
 player.inv=Math.max(0,player.inv-dt);
 speed=Math.min(11,5+world/1500);
 score+=dt*speed*2;
 level=1+Math.floor(world/1800);
 spawn-=dt;coinSpawn-=dt;
 if(spawn<=0){spawnObstacle();spawn=1.15+Math.random()*.65}
 if(coinSpawn<=0){spawnCoin();coinSpawn=.65+Math.random()*.45}
 obstacles.forEach(o=>{
  o.x-=speed*dt*60;
  if(!o.hit&&o.lane===player.lane&&Math.abs(o.x-player.x)<34){
   if(!player.jumping&&player.inv<=0){
    lives--;player.inv=1.6;o.hit=true;burst(player.x,roadY-25,'#ff4c58');
   }
  }
 });
 gold.forEach(c=>{c.x-=speed*dt*60;c.spin+=dt*9});
 gold=gold.filter(c=>{
  if(c.lane===player.lane&&Math.abs(c.x-player.x)<35&&Math.abs(c.y-(player.y-35))<65){
   coins++;score+=100;burst(c.x,c.y,'#ffe66d');return false
  }
  return c.x>-50
 });
 obstacles=obstacles.filter(o=>o.x>-80);
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});
 particles=particles.filter(p=>p.life>0);
 // Thief moves closer as the player survives.
 thief.x=Math.max(player.x+48,thief.x-dt*(8+level));
 if(thief.x-player.x<65){end(true);return}
 if(lives<=0){end(false);return}
 if(score>0&&Math.floor(score)%1800<speed*dt*2&&questionCount<Math.floor(score/1800)){
  questionCount++;askMath();updateHud();draw();return;
 }
 updateHud();draw();raf=requestAnimationFrame(loop);
}
reset();drawSky();drawRoad();drawPerson(W*.32,roadY,false,0);drawPerson(W*.7,roadY,true,1);
</script>
</body>
</html>
